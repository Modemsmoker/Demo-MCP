[project]
name = "demo-mcp"
version = "0.0.0"          # PSR owns this from here on
description = "A demo Model Context Protocol server."
requires-python = ">=3.12"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Illustrative snippets in docs are not held to the formatter.
extend-exclude = ["docs"]

[tool.ruff.lint]
# E/F pycodestyle+pyflakes, I import sorting, UP pyupgrade, B bugbear,
# ASYNC catches blocking calls inside async tool handlers, ANN201 forces
# return annotations because MCP derives tool schemas from them.
select = ["E", "F", "I", "UP", "B", "ASYNC", "ANN201"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN201"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.semantic_release]
tag_format = "v{version}"
version_toml = ["pyproject.toml:project.version"]
version_variables = ["demo_mcp/__init__.py:__version__"]
commit_message = "chore(release): v{version} [skip ci]"
allow_zero_version = true
major_on_zero = false

[tool.semantic_release.commit_parser_options]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]
parse_squash_commits = true
ignore_merge_commits = true

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"
output_format = "md"
